<div class="success-page">
  <div class="success-card">
    <div class="icon-container">
      <div class="check-icon"><i class="fa-solid fa-check"></i></div>
    </div>

    <h1 class="title">{{ 'payments.confirmed.title' | translate }}</h1>
    <p class="message">{{ 'payments.confirmed.message' | translate }}</p>

    <div class="action-section">
      <button class="login-btn" type="button" (click)="goToLogin()">
        {{ 'payments.confirmed.login' | translate }}
      </button>
      <p class="support-text">
        {{ 'payments.confirmed.support' | translate }}
        <a href="#">{{ 'payments.confirmed.contact' | translate }}</a>
      </p>
    </div>
  </div>
</div>
